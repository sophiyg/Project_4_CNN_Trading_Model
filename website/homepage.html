<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CNN Trading Model</title>
</head>
<body>

    <h1>Welcome to our CNN Trading Prediction Model</h1>
  <form id="predictionForm">
        <label for="imageInput">Upload your image:</label>
        <input type="file" id="imageInput" accept="image/*" required>

        <p id="predictionText">Waiting for image...</p>
    </div>
    <script src="predict.js"></script>
    
</body>
</html>
